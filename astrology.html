<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Astroloji Haritası - v3.1.0</title>
    <link rel="stylesheet" href="astrology.css?v=3.1.0">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌌 Profesyonel Doğum Haritası</h1>
            <p class="version">v3.1.0 - Gerçek Astronomik Hesaplamalar</p>
        </header>

        <div class="form-card">
            <h2>📋 Doğum Bilgileri</h2>
            <div class="form-grid">
                <div>
                    <label>📅 Doğum Tarihi</label>
                    <input type="date" id="birth-date" value="1993-01-31">
                </div>
                <div>
                    <label>🕐 Doğum Saati (Yerel)</label>
                    <input type="time" id="birth-time" value="15:00">
                </div>
                <div>
                    <label>📍 Şehir</label>
                    <select id="city">
                        <option value="ankara" data-lat="39.933" data-lon="32.850" data-tz="2" selected>Ankara</option>
                        <option value="istanbul" data-lat="41.015" data-lon="28.980" data-tz="2">İstanbul</option>
                        <option value="izmir" data-lat="38.420" data-lon="27.140" data-tz="2">İzmir</option>
                    </select>
                </div>
            </div>
            <button onclick="generateChart()" class="btn-primary">✨ Harita Oluştur</button>
        </div>

        <div class="chart-container">
            <div class="chart-wrapper">
                <canvas id="main-canvas" width="800" height="800"></canvas>
                <div id="chart-overlays"></div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <h3>📊 Harita Bilgileri</h3>
                <div id="chart-info"></div>
            </div>
            <div class="info-card">
                <h3>🪐 Gezegenler</h3>
                <div id="planets-info"></div>
            </div>
            <div class="info-card">
                <h3>⭐ Aspectler</h3>
                <div id="aspects-info"></div>
            </div>
        </div>
    </div>

    <script src="astrology.js?v=3.1.0"></script>
</body>
</html>
