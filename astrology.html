<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBEY - Astroloji Haritası v3.0.0</title>
    <link rel="stylesheet" href="astrology.css?v=3.0.0">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🌌 Astroloji Haritası</h1>
            <p class="version">v3.0.0 - 15.07.2026</p>
        </header>

        <!-- Form -->
        <div class="form-card">
            <h2>📋 Doğum Bilgileri</h2>
            <form id="birth-form" onsubmit="return false;">
                <div class="form-row">
                    <label>📅 Tarih</label>
                    <input type="date" id="birth-date" value="1993-01-31" required>
                </div>
                <div class="form-row">
                    <label>🕐 Saat</label>
                    <input type="time" id="birth-time" value="15:00" required>
                </div>
                <div class="form-row">
                    <label>📍 Şehir</label>
                    <select id="city" required>
                        <option value="ankara" data-lat="39.93" data-lon="32.85" selected>Ankara</option>
                        <option value="istanbul" data-lat="41.01" data-lon="28.98">İstanbul</option>
                        <option value="izmir" data-lat="38.42" data-lon="27.14">İzmir</option>
                    </select>
                </div>
                <button type="button" onclick="createChart()" class="btn-primary">✨ Harita Oluştur</button>
            </form>
        </div>

        <!-- Chart -->
        <div class="chart-card">
            <h2>🔮 Doğum Haritası</h2>
            <div id="chart-area">
                <canvas id="chart-canvas" width="600" height="600"></canvas>
                <div id="chart-elements"></div>
            </div>
        </div>

        <!-- Info -->
        <div class="info-card">
            <h3 id="info-title">Bilgi</h3>
            <div id="info-content">
                <p>Formu doldurup "Harita Oluştur" butonuna basın.</p>
            </div>
        </div>
    </div>

    <script src="astrology.js?v=3.0.0"></script>
</body>
</html>
