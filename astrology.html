<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBEY - İnteraktif Astroloji Haritası</title>
    
    <!-- Cache Önleme -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="astrology.css?v=2">
</head>
<body>
    <div class="astro-container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🌌 Astroloji Haritası</h1>
            <p class="subtitle">Doğum bilgilerinizi girin</p>
        </div>

        <!-- Doğum Bilgileri Formu -->
        <div class="birth-info-form" id="birth-form">
            <h2>🎂 Doğum Bilgileri</h2>
            
            <div class="form-group">
                <label for="birth-date">📅 Doğum Tarihi</label>
                <input type="date" id="birth-date" class="form-input" value="1993-01-31" required>
            </div>
            
            <div class="form-group">
                <label for="birth-time">🕐 Doğum Saati</label>
                <input type="time" id="birth-time" class="form-input" value="15:00" required>
            </div>
            
            <div class="form-group">
                <label for="birth-city">📍 Doğum Yeri (Şehir)</label>
                <select id="birth-city" class="form-input">
                    <option value="">Şehir Seçin</option>
                    <option value="istanbul">İstanbul</option>
                    <option value="ankara" selected>Ankara</option>
                    <option value="izmir">İzmir</option>
                    <option value="bursa">Bursa</option>
                    <option value="antalya">Antalya</option>
                    <option value="adana">Adana</option>
                    <option value="gaziantep">Gaziantep</option>
                    <option value="konya">Konya</option>
                    <option value="trabzon">Trabzon</option>
                    <option value="diyarbakir">Diyarbakır</option>
                </select>
            </div>
            
            <button id="calculate-chart" class="calculate-btn">✨ Haritamı Oluştur</button>
        </div>

        <!-- Sonuç Paneli -->
        <div class="results-panel" id="results-panel" style="display: none;">
            <h2>🔮 Astroloji Analizi</h2>
            
            <div class="result-card">
                <h3>☀️ Güneş Burcunuz</h3>
                <div id="sun-sign" class="result-content"></div>
            </div>
            
            <div class="result-card">
                <h3>⬆️ Yükselen Burcunuz (Ascendant)</h3>
                <div id="rising-sign" class="result-content"></div>
            </div>
            
            <div class="result-card">
                <h3>🏠 12 Astroloji Evi</h3>
                <div id="houses" class="houses-grid"></div>
            </div>
            
            <div class="result-card">
                <h3>🌙 Diğer Önemli Konumlar</h3>
                <div id="other-positions" class="result-content"></div>
            </div>
            
            <button id="new-calculation" class="control-btn">🔄 Yeni Hesaplama</button>
        </div>

        <!-- Ana Astroloji Haritası (Görsel) -->
        <div class="chart-wrapper" id="chart-wrapper" style="display: none;">
            <canvas id="astro-canvas"></canvas>
            <div class="chart-legend" id="chart-legend"></div>
            
            <!-- Zoom Kontrolleri -->
            <div class="zoom-controls">
                <button id="zoom-in" class="zoom-btn">+</button>
                <button id="zoom-out" class="zoom-btn">−</button>
                <button id="reset-zoom" class="zoom-btn">⟲</button>
            </div>
        </div>

        <!-- Kontrol Paneli -->
        <div class="controls" id="controls" style="display: none;">
            <button id="show-chart" class="control-btn">🎨 Haritayı Göster/Gizle</button>
            <button id="download-chart" class="control-btn">💾 İndir</button>
        </div>

        <!-- Geri Dön Butonu -->
        <a href="index.html" class="back-btn">← Ana Sayfa</a>
    </div>

    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- Swiss Ephemeris (Profesyonel Astroloji Hesaplamaları) -->
    <script src="https://cdn.jsdelivr.net/npm/@swisseph/browser@1.1.1/dist/swisseph.browser.min.js" 
            onerror="console.error('Swiss Ephemeris CDN yüklenemedi! Fallback kullanılacak.')"></script>
    <script src="astrology-swisseph.js?v=2"></script>
    <script src="astrology.js?v=2"></script>
</body>
</html>
