<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KUBEY - Profesyonel Astroloji Haritası</title>
    <link rel="stylesheet" href="astrology.css?v=2.0.0">
</head>
<body>
    <div class="astro-container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🌌 Profesyonel Astroloji Haritası</h1>
            <p class="subtitle">Doğum bilgilerinizi girin ve kişisel haritanızı oluşturun</p>
        </div>

        <!-- Doğum Bilgileri Formu -->
        <div class="birth-form" id="birth-form">
            <h3>📋 Doğum Bilgileri</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Ad Soyad</label>
                    <input type="text" id="name" placeholder="Örn: Ahmet Yılmaz">
                </div>
                <div class="form-group">
                    <label>Doğum Tarihi</label>
                    <input type="date" id="birth-date" value="1993-01-31">
                </div>
                <div class="form-group">
                    <label>Doğum Saati</label>
                    <input type="time" id="birth-time" value="15:00">
                </div>
                <div class="form-group">
                    <label>Şehir</label>
                    <input type="text" id="city" placeholder="Örn: Ankara" value="Ankara">
                </div>
                <div class="form-group">
                    <label>Enlem</label>
                    <input type="text" id="latitude" placeholder="39.55" value="39.55">
                </div>
                <div class="form-group">
                    <label>Boylam</label>
                    <input type="text" id="longitude" placeholder="32.51" value="32.51">
                </div>
            </div>
            <button id="generate-chart" class="generate-btn">✨ Harita Oluştur</button>
        </div>

        <!-- Ana Astroloji Haritası -->
        <div class="chart-wrapper" id="chart-wrapper">
            <canvas id="astro-canvas"></canvas>
            
            <!-- Aspects Canvas (gezegen bağlantıları) -->
            <canvas id="aspects-canvas"></canvas>
            
            <!-- 12 Ev Sistemi -->
            <div class="houses-wheel" id="houses-wheel"></div>

            <!-- 12 Burç -->
            <div class="zodiac-wheel" id="zodiac-wheel">
                <!-- Burçlar JavaScript ile dinamik oluşturulur -->
            </div>

            <!-- Gezegenler ve Noktalar -->
            <div class="planets-container" id="planets-container">
                <div class="planet" id="sun" data-planet="sun" data-degree="0">
                    <span class="planet-symbol">☉</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="moon" data-planet="moon" data-degree="0">
                    <span class="planet-symbol">☽</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="mercury" data-planet="mercury" data-degree="0">
                    <span class="planet-symbol">☿</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="venus" data-planet="venus" data-degree="0">
                    <span class="planet-symbol">♀</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="mars" data-planet="mars" data-degree="0">
                    <span class="planet-symbol">♂</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="jupiter" data-planet="jupiter" data-degree="0">
                    <span class="planet-symbol">♃</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="saturn" data-planet="saturn" data-degree="0">
                    <span class="planet-symbol">♄</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="uranus" data-planet="uranus" data-degree="0">
                    <span class="planet-symbol">♅</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="neptune" data-planet="neptune" data-degree="0">
                    <span class="planet-symbol">♆</span>
                    <span class="planet-degree">0°</span>
                </div>
                <div class="planet" id="pluto" data-planet="pluto" data-degree="0">
                    <span class="planet-symbol">♇</span>
                    <span class="planet-degree">0°</span>
                </div>
            </div>
            
            <!-- Ascendant ve MC İşaretleri -->
            <div class="special-point" id="ascendant" data-point="asc">
                <span class="point-symbol">AC</span>
            </div>
            <div class="special-point" id="midheaven" data-point="mc">
                <span class="point-symbol">MC</span>
            </div>

            <!-- Yıldızlar -->
            <div class="stars-container" id="stars-container"></div>
        </div>

        <!-- Kontrol Paneli -->
        <div class="controls">
            <button id="rotate-left" class="control-btn">↶ Sola Döndür</button>
            <button id="rotate-right" class="control-btn">↷ Sağa Döndür</button>
            <button id="reset-chart" class="control-btn">🔄 Sıfırla</button>
            <button id="toggle-aspects" class="control-btn">🔗 Aspectler</button>
            <button id="toggle-houses" class="control-btn">🏠 Evler</button>
        </div>

        <!-- Bilgi Paneli -->
        <div class="info-panel" id="info-panel">
            <h3>🔮 Doğum Haritası Bilgileri</h3>
            <div id="info-content">
                <p>Lütfen doğum bilgilerinizi girin ve harita oluştur butonuna tıklayın</p>
            </div>
        </div>

        <!-- Aspect Tablosu -->
        <div class="aspects-table" id="aspects-table">
            <h3>⭐ Aspectler</h3>
            <div id="aspects-list"></div>
        </div>

        <!-- Geri Dön Butonu -->
        <a href="index.html" class="back-btn">← Ana Sayfa</a>
    </div>

    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        // Cache busting - Versiyon kontrolü
        const APP_VERSION = '2.0.0';
        const LAST_VERSION = localStorage.getItem('astro_version');
        
        if (LAST_VERSION !== APP_VERSION) {
            // Yeni versiyon varsa cache'i temizle
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            localStorage.setItem('astro_version', APP_VERSION);
            console.log('Yeni versiyon yüklendi:', APP_VERSION);
        }
    </script>
    <script src="astrology.js?v=2.0.0"></script>
</body>
</html>
